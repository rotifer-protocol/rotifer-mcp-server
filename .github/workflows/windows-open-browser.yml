name: Windows browser open

on:
  push:
    branches: [fix/login-browser-open-hardening]

permissions:
  contents: read

jobs:
  spawn-check:
    name: Real spawn on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/ci/windows-open-browser-check.mjs
