name: Windows browser open

on:
  push:
    branches: [fix/login-browser-open-hardening]

permissions:
  contents: read

jobs:
  spawn-check:
    name: Real spawn on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Diagnose the default https association
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Snap { Get-CimInstance Win32_Process | Select-Object ProcessId, Name, CommandLine }
          function Show-New($label, $before) {
            Start-Sleep 15
            $new = @(Snap | Where-Object { $before -notcontains $_.ProcessId -and $_.Name -notmatch '^(conhost|WmiPrvSE|pwsh|powershell)' })
            Write-Output "=== ${label}: $($new.Count) new processes"
            $new | ForEach-Object { Write-Output ("DIAG {0} :: {1}" -f $_.Name, $_.CommandLine) }
          }
          Write-Output "=== OS"; (Get-CimInstance Win32_OperatingSystem).Caption
          Write-Output "=== HKCU url association"; reg query "HKCU\Software\Microsoft\Windows\Shell\Associations\UrlAssociations\https" /s
          Write-Output "=== HKCR https command"; reg query "HKCR\https\shell\open\command" /s
          Write-Output "=== session"; [Environment]::UserInteractive; (Get-Process -Id $PID).SessionId
          $before = (Snap).ProcessId
          $p = Start-Process -FilePath "$env:SystemRoot\System32\rundll32.exe" -ArgumentList 'url.dll,FileProtocolHandler','https://example.invalid/?diag=rundll&x=2' -PassThru
          Show-New 'rundll32' $before
          Write-Output "DIAG rundll32 exited=$($p.HasExited) code=$($p.ExitCode)"
          $before = (Snap).ProcessId
          Start-Process 'https://example.invalid/?diag=control&x=2'
          Show-New 'ShellExecute control' $before
          exit 0
      - name: Baseline, unfixed code (expected to fail)
        continue-on-error: true
        shell: bash
        run: |
          git fetch --depth=1 origin de5578a6c46cdcc1e5d2fc0191db748bb03326de
          git worktree add ../baseline FETCH_HEAD
          (cd ../baseline && npm ci && npm run build)
          node scripts/ci/windows-open-browser-check.mjs ../baseline/dist
      - name: Fixed code
        run: node scripts/ci/windows-open-browser-check.mjs
