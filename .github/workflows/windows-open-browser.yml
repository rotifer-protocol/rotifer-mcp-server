name: Windows browser open

on:
  pull_request:
    branches: [main]
    paths:
      - "src/auth.ts"
      - "src/open-browser.ts"
      - "src/validate-url.ts"
      - "src/login.ts"
      - "src/tools.ts"
      - "scripts/ci/windows-open-browser-check.mjs"
      - "scripts/ci/windows-login-flow-check.mjs"
      - ".github/workflows/windows-open-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spawn-check:
    name: Real spawn on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/ci/windows-open-browser-check.mjs

  login-flow:
    name: Full login flow on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/ci/windows-login-flow-check.mjs
